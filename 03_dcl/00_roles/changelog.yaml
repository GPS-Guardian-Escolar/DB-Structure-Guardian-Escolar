databaseChangeLog:
  - changeSet:
      id: 006-dcl-create-database-roles
      author: gps-guardian-escolar
      logicalFilePath: 03_dcl/00_roles/001_create_database_roles.sql
      labels: "dcl,roles"
      comment: Creates database-level roles for application and read-only access.
      changes:
        - sqlFile:
            path: 001_create_database_roles.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/00_roles/001_create_database_roles.rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
  - changeSet:
      id: 006b-dcl-enable-application-role-login
      author: gps-guardian-escolar
      logicalFilePath: 03_dcl/00_roles/002_enable_application_role_login.sql
      labels: "dcl,roles,application,credentials"
      comment: Enables login for the least-privilege application role using an externally supplied password.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN '${APP_DB_PASSWORD}' ~ '^[A-Za-z0-9_-]{32,}$' THEN 1 ELSE 0 END"
      changes:
        - sqlFile:
            path: 002_enable_application_role_login.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/00_roles/002_enable_application_role_login.rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
