services:

  postgres:
    image: postgres:15
    container_name: gps_guardian_escolar_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gps_guardian_escolar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./01_ddl:/db/01_ddl:ro
      - ./02_dml:/db/02_dml:ro
      - ./03_dcl:/db/03_dcl:ro
      - ./liquibase.properties:/liquibase/liquibase.properties:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  liquibase:
    build:
      context: .
      dockerfile: Dockerfile

    image: gps_guardian_escolar_liquibase:latest
    container_name: gps_guardian_escolar_liquibase

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./changelog:/liquibase/changelog
      - ./01_ddl:/db/01_ddl:ro
      - ./02_dml:/db/02_dml:ro
      - ./03_dcl:/db/03_dcl:ro
      - ./liquibase.properties:/liquibase/liquibase.properties:ro

    entrypoint: ["liquibase"]

    command:
      - --defaultsFile=/liquibase/liquibase.properties
      - update


volumes:
  postgres_data:
    name: gps_guardian_escolar_postgres_data
