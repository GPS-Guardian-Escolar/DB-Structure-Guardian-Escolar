databaseChangeLog:
  - changeSet:
      id: 009a-dml-refresh-materialized-views
      author: gps-guardian-escolar
      logicalFilePath: 02_dml/04_patches/001_refresh_materialized_views.sql
      labels: "dml,patch,materialized-views"
      comment: Refreshes materialized views after initial or bulk data loads.
      changes:
        - sqlFile:
            path: 001_refresh_materialized_views.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
      rollback:
