databaseChangeLog:
  - changeSet:
      id: 005a-dml-security-catalog
      author: gps-guardian-escolar
      logicalFilePath: 02_dml/00_inserts/001_security_catalog.sql
      labels: "dml,system,inserts,security"
      comment: Loads required roles, permissions and security defaults.
      changes:
        - sqlFile:
            path: 001_security_catalog.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/00_inserts/001_security_catalog.rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
  - changeSet:
      id: 005b-dml-admin-user
      author: gps-guardian-escolar
      logicalFilePath: 02_dml/00_inserts/002_admin_user.sql
      labels: "dml,system,inserts,admin"
      context: local
      comment: Loads the required administrator account.
      changes:
        - sqlFile:
            path: 002_admin_user.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/00_inserts/002_admin_user.rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
  - changeSet:
      id: 005c-dml-rotate-local-admin-credentials
      author: gps-guardian-escolar
      logicalFilePath: 02_dml/00_inserts/003_rotate_local_admin_credentials.sql
      labels: "dml,system,admin,credentials"
      context: local
      comment: Replaces the legacy local administrator password and contact details with supplied values.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN '${ADMIN_EMAIL}' <> '' AND '${ADMIN_PHONE}' <> '' AND '${ADMIN_PASSWORD_HASH}' <> '' THEN 1 ELSE 0 END"
      changes:
        - sqlFile:
            path: 003_rotate_local_admin_credentials.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/02_dml/00_inserts/003_rotate_local_admin_credentials.rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
            stripComments: false
